services:
  postgres:
    image: postgres:18-alpine
    container_name: jym-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jym
      POSTGRES_PASSWORD: jym
      POSTGRES_DB: jym
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18+: монтування на /var/lib/postgresql, а не .../data —
      # образ сам кладе дані в підкаталог 18/docker. Старий шлях дає
      # цикл перезапусків з помилкою про 'unused mount/volume'
      - postgres-data-18:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jym -d jym']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data-18:
