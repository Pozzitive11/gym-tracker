services:
  postgres:
    image: postgres:18-alpine
    container_name: jym-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jym
      POSTGRES_PASSWORD: jym
      POSTGRES_DB: jym
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jym -d jym']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
