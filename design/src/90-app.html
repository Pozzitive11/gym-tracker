/* ================= helpers ================= */
const fmt   = n => (Math.round(n*100)/100).toString().replace(/\.0+$/,'');
const pad   = n => String(n).padStart(2,'0');
const clock = s => Math.floor(s/60)+':'+pad(s%60);
const thou  = n => n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const esc   = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

function pluralRecords(n){
  const a = n%10, b = n%100;
  if(a===1 && b!==11) return 'запис чекає';
  if(a>=2 && a<=4 && (b<12 || b>14)) return 'записи чекають';
  return 'записів чекають';
}
function pluralEx(n){
  const a = n%10, b = n%100;
  if(a===1 && b!==11) return 'вправа';
  if(a>=2 && a<=4 && (b<12 || b>14)) return 'вправи';
  return 'вправ';
}
function series(base, pct, n, seed){
  const start = pct === 0 ? base*0.99 : base/(1+pct/100);
  const out = []; let s = seed>>>0;
  for(let i=0;i<n;i++){
    s = (s*1664525 + 1013904223) >>> 0;
    const jitter = ((s>>>16)/65535 - 0.5) * base * 0.02;
    out.push(start + (base-start)*(i/(n-1)) + (i===n-1 ? 0 : jitter));
  }
  return out;
}
function sparkline(values, w, h, color){
  const min = Math.min(...values), max = Math.max(...values), span = (max-min)||1;
  const pts = values.map((v,i)=>{
    const x = (i/(values.length-1))*(w-2)+1;
    const y = h-1 - ((v-min)/span)*(h-2);
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" fill="none" aria-hidden="true">'+
         '<polyline points="'+pts+'" stroke="'+color+'" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

/* charts: one series each, direct-labelled, no chartjunk */
function lineChart(vals, unit){
  const W=318, H=150, R=40, T=12, B=10;
  const pw = W-R, ph = H-T-B;
  const min = Math.min(...vals), max = Math.max(...vals), span = (max-min)||1;
  const lo = min-span*0.25, hi = max+span*0.25, s = hi-lo;
  const X = i => (i/(vals.length-1))*pw;
  const Y = v => T + ph - ((v-lo)/s)*ph;
  const pts  = vals.map((v,i)=> X(i).toFixed(1)+','+Y(v).toFixed(1));
  const area = 'M'+pts.join(' L')+' L'+pw.toFixed(1)+','+(T+ph)+' L0,'+(T+ph)+' Z';
  const grid = [max, (max+min)/2, min].map(v =>
    '<line class="grid" x1="0" x2="'+pw+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/>'+
    '<text class="vlab" x="'+(pw+9)+'" y="'+(Y(v)+3.5).toFixed(1)+'">'+fmt(Math.round(v*10)/10)+'</text>').join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Динаміка: '+unit+'">'+
         grid+
         '<path class="area" d="'+area+'"/>'+
         '<polyline class="line" points="'+pts.join(' ')+'"/>'+
         '<circle class="dot" cx="'+X(vals.length-1).toFixed(1)+'" cy="'+Y(vals[vals.length-1]).toFixed(1)+'" r="4"/>'+
         '</svg>';
}
function barChart(vals){
  const W=318, H=110, R=40, T=8, B=6;
  const pw = W-R, ph = H-T-B;
  const max = Math.max(...vals);
  const gap = 5, bw = (pw-gap*(vals.length-1))/vals.length;
  const bars = vals.map((v,i)=>{
    const h = Math.max(3, (v/max)*ph);
    return '<rect class="bar'+(i===vals.length-1?' hi':'')+'" x="'+(i*(bw+gap)).toFixed(1)+
           '" y="'+(T+ph-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3"/>';
  }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Обʼєм за тренування">'+bars+
         '<text class="vlab" x="'+(pw+9)+'" y="'+(T+7)+'">'+thou(max)+'</text></svg>';
}

/* ================= app ================= */
(function(){
const root = document.querySelector('.v');
const $  = s => root.querySelector(s);
const $$ = s => [...root.querySelectorAll(s)];
const F  = n => root.querySelector('[data-f="'+n+'"]');

const cfg   = {rest:120, autofill:true, active:true, days:3, name:''};
const ex    = PLAN.map(e => ({...e, done:[], sub:null}));
ex[0].done.push({w:82.5, r:8, hit:true});          // the session is already under way
const day   = PLAN.map(e => ({...e}));             // the day being edited
const state = {i:0, w:0, reps:0, elapsed:770, restEnd:0, screen:'home', stack:[], detail:'Жим лежачи'};

/* ---------- navigation ---------- */
const TABS_HTML = TABS.map(t =>
  '<button data-tab="'+t.k+'">'+
  '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="'+t.d+'"/></svg>'+
  '<span>'+t.label+'</span></button>').join('');
$$('[data-tabs]').forEach(nav => nav.innerHTML = TABS_HTML);

const ROOTS = ['home','progress','catalog','empty'];
function show(name, push){
  if(push && state.screen !== name) state.stack.push(state.screen);
  if(ROOTS.includes(name)) state.stack = [];
  state.screen = name;
  $$('.scr').forEach(s => s.toggleAttribute('data-on', s.dataset.screen === name));
  const tab = name === 'progress' ? 'progress'
            : (name === 'catalog' ? 'exercises' : 'workout');
  $$('[data-tab]').forEach(b => b.toggleAttribute('data-on', b.dataset.tab === tab));
  $$('.body').forEach(b => b.scrollTop = 0);
  root.scrollTop = 0;   // the shell itself must never scroll
  if(name === 'summary')   playSummary();
  if(name === 'exdetail')  renderDetail(state.detail);
  if(name === 'day')       renderDay();
  if(name === 'newprogram')renderSlots();
}
function back(){ show(state.stack.pop() || 'home'); }

/* ---------- workout ---------- */
const list  = $('[data-ex-list]');
const panel = $('[data-panel]');
ex.forEach((e,i)=>{
  const b = document.createElement('button');
  b.className = 'exrow';
  b.dataset.ex = i;
  b.innerHTML = '<span><span class="nm" data-rowname></span></span><span class="mt" data-rowmeta></span>';
  b.addEventListener('click', ()=> select(i));
  list.insertBefore(b, panel);
});

function rowLabel(i){
  const e = ex[i], row = $('[data-ex="'+i+'"]');
  row.querySelector('[data-rowname]').textContent = e.sub || e.name;
  row.querySelector('[data-rowmeta]').textContent =
    e.done.length >= e.sets ? e.done.length+' / '+e.sets
                            : e.sets+'×'+e.reps+' · '+fmt(e.w)+' кг';
  row.toggleAttribute('data-done', e.done.length >= e.sets);
}
function select(i){
  state.i = i;
  const e = ex[i];
  state.w = cfg.autofill ? (e.done.length ? e.done[e.done.length-1].w : e.w) : 0;
  state.reps = cfg.autofill ? e.reps : 0;
  $$('[data-ex]').forEach(r => r.hidden = (+r.dataset.ex === i));
  $('[data-ex="'+i+'"]').after(panel);
  fillPanel();
}
function fillPanel(){
  const e = ex[state.i];
  F('name').textContent = e.sub || e.name;
  panel.toggleAttribute('data-swapped', !!e.sub);
  if(e.sub) F('swapped').textContent = 'замість: ' + e.name;
  F('setno').textContent = 'Підхід ' + Math.min(e.done.length+1, e.sets) + ' з ' + e.sets;
  F('target').textContent = e.reps + ' повторень';
  F('weight').textContent = fmt(state.w);
  F('reps').textContent = state.reps;
  F('stepdown').textContent = '−'+fmt(e.step);
  F('stepup').textContent   = '+'+fmt(e.step);
  renderTiles();
  ex.forEach((_,i)=> rowLabel(i));
  renderSegs();
}
function renderTiles(){
  const e = ex[state.i], out = [];
  for(let i=0;i<e.sets;i++){
    const s = e.done[i];
    out.push(s ? '<span class="tile"'+(s.hit?'':' data-miss')+'>'+fmt(s.w)+'×'+s.r+'</span>'
               : '<span class="tile" data-pending>·</span>');
  }
  $('[data-tiles]').innerHTML = out.join('');
}
function renderSegs(){
  $('[data-segs]').innerHTML = ex.map((e,i)=>
    '<i'+(e.done.length>=e.sets?' data-done':'')+(i===state.i?' data-cur':'')+'></i>').join('');
}

/* steppers: feedback on pointer-down, then accelerating repeat while held */
function bump(kind){
  const e = ex[state.i];
  if(kind === 'w-') state.w = Math.max(0, state.w - e.step);
  if(kind === 'w+') state.w += e.step;
  if(kind === 'r-') state.reps = Math.max(0, state.reps - 1);
  if(kind === 'r+') state.reps += 1;
  F('weight').textContent = fmt(state.w);
  F('reps').textContent = state.reps;
}
$$('[data-act]').forEach(btn=>{
  const kind = btn.dataset.act;
  if(!/^[wr][-+]$/.test(kind)) return;
  let hold, delay;
  const stop = ()=> clearTimeout(hold);
  btn.addEventListener('pointerdown', e=>{
    btn.setPointerCapture(e.pointerId);
    bump(kind);
    delay = 110;
    hold = setTimeout(function run(){
      bump(kind);
      delay = Math.max(45, delay - 8);
      hold = setTimeout(run, delay);
    }, 420);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(t => btn.addEventListener(t, stop));
});

const commitBtn = $('[data-commit]');
const rest      = $('[data-rest]');
const restFill  = $('[data-rest-fill]');
let restAnim = null, restTick = null;

function totalSets(){ return ex.reduce((a,e)=> a + e.done.length, 0); }
function updateOffline(){
  const n = totalSets();
  $('[data-offline]').toggleAttribute('data-on', n >= 3);
  F('offline-text').textContent = n + ' ' + pluralRecords(n) + ' на зʼєднання';
}
function commit(){
  const e = ex[state.i];
  if(e.done.length >= e.sets) return;
  e.done.push({w:state.w, r:state.reps, hit: state.reps >= e.reps});
  renderTiles();
  const fresh = $('[data-tiles]').children[e.done.length-1];
  if(fresh) fresh.setAttribute('data-fresh','');
  rowLabel(state.i);
  renderSegs();
  updateOffline();
  startRest();
  if(e.done.length >= e.sets){
    const next = ex.findIndex(x => x.done.length < x.sets);
    if(next >= 0) setTimeout(()=> select(next), 600);
  }
}
function startRest(){
  commitBtn.setAttribute('data-hide','');
  rest.setAttribute('data-on','');
  state.restEnd = Date.now() + cfg.rest*1000;
  restAnim?.cancel();
  restFill.style.transform = 'scaleX(1)';
  if(!reduceMotion()){
    restAnim = restFill.animate([{transform:'scaleX(1)'},{transform:'scaleX(0)'}],
      {duration: cfg.rest*1000, easing:'linear', fill:'forwards'});
  }
  clearInterval(restTick);
  const paint = ()=>{
    const left = Math.max(0, Math.round((state.restEnd - Date.now())/1000));
    F('rest-time').textContent = clock(left);
    if(left <= 0) stopRest();
  };
  paint();
  restTick = setInterval(paint, 250);
}
function stopRest(){
  clearInterval(restTick);
  restAnim?.cancel();
  rest.removeAttribute('data-on');
  commitBtn.removeAttribute('data-hide');
}

/* ---------- swap sheet ---------- */
$('[data-chips]').innerHTML = RECENT.map(n => '<button data-chip>'+n+'</button>').join('');
const sheetInput = $('[data-sheet-input]');

/* ---------- summary ---------- */
function countTo(el, target, ms, format){
  const t0 = performance.now();
  (function step(now){
    const p = Math.min(1, (now-t0)/ms);
    el.textContent = format(Math.round(target*(1-Math.pow(1-p,3))));
    if(p < 1) requestAnimationFrame(step);
  })(t0);
}
function playSummary(){
  $$('.rise').forEach(el=>{ el.style.animation='none'; void el.offsetWidth; el.style.animation=''; });
  if(reduceMotion()){
    F('s-vol').textContent = thou(6940); F('s-sets').textContent = '20';
  } else {
    countTo(F('s-vol'), 6940, 900, thou);
    countTo(F('s-sets'), 20, 900, String);
  }
}

/* ---------- progress ---------- */
function renderPeriod(p){
  F('p-sessions').textContent = PERIOD[p].s;
  F('p-volume').textContent   = PERIOD[p].v;
  F('p-records').textContent  = PERIOD[p].r;
  const css = getComputedStyle(root);
  const dim = css.getPropertyValue('--dim2').trim();
  const acc = css.getPropertyValue('--acc').trim();
  $('[data-exstats]').innerHTML = EXSTATS.map(s=>{
    const pct = s.p[p], flat = pct === 0;
    return '<button class="exstat" data-detail="'+esc(s.n)+'">'+
      '<span><span class="nm">'+s.n+'</span><span class="kg">робоча '+fmt(s.w)+' кг</span></span>'+
      sparkline(series(s.w, pct, 10, s.seed + p.charCodeAt(0)), 56, 22, flat ? dim : acc)+
      '<span class="pc"'+(flat?' data-flat':'')+'>'+(flat ? '0%' : '+'+pct.toFixed(1)+'%')+'</span>'+
      '</button>';
  }).join('');
}
$('[data-history]').innerHTML = HISTORY.map((h,i) =>
  '<button class="hrow" data-past="'+i+'" style="width:100%;border:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer">'+
  '<span><span class="d" style="display:block">'+h.d+'</span>'+
  '<span class="dd" style="display:block">'+h.day+'</span></span>'+
  '<span class="r"><span style="display:block">'+h.t+'</span>'+
  '<span style="display:block;margin-top:4px">'+h.v+'</span></span></button>').join('');
renderPeriod('m');

/* ---------- exercise detail ---------- */
function detailFor(name){
  const st   = EXSTATS.find(x=>x.n===name) || EXSTATS[0];
  const plan = PLAN.find(p=>p.name===name);
  const cat  = CATALOG.find(c=>c.n===name);
  const target = plan ? plan.reps : 8;
  const round  = v => Math.round(v/2.5)*2.5;
  const w = series(st.w, st.p.y, 12, st.seed).map(round);
  const v = w.map((x,i)=> Math.round((x*target*3.2 + (i%4)*35)/10)*10);
  const dates = ['4 вересня','2 вересня','31 серпня','29 серпня'];
  const log = dates.map((d,i)=>{
    const base = w[11-i*2];
    const sets = [
      [base, target],
      [base, target],
      [base, i===0 ? target : target-1],
      [i===0 ? base : round(base-2.5), target-2]
    ];
    return {d, sets, vol: Math.round(sets.reduce((a,s)=>a+s[0]*s[1],0))};
  });
  // the hand-authored session must not contradict the past-workout screen
  const authored = PAST.ex.find(x => x.n === name);
  if(authored){
    log[0] = {d: PAST.date, sets: authored.sets, vol: authored.vol};
    v[11] = authored.vol;
  }
  const [prW, prR] = st.pr;
  return {
    group: cat ? cat.g : 'Інше', gear: cat ? cat.e.toLowerCase() : 'без обладнання',
    pr: fmt(prW)+' × '+prR, orm: (prW*(1+prR/30)).toFixed(1),
    w, v, log, target,
    growth: st.p.y
  };
}
function renderDetail(name){
  const d = detailFor(name);
  F('xd-name').textContent = name;
  F('xd-meta').textContent = d.group + ' · ' + d.gear;
  F('xd-pr').textContent   = d.pr;
  F('xd-1rm').textContent  = d.orm;

  $('[data-chart-weight]').innerHTML =
    '<div class="ct"><span class="h">Робоча вага, кг</span>'+
    '<span class="now">'+fmt(d.w[11])+'</span>'+
    '<span class="delta">+'+d.growth.toFixed(1)+'%</span></div>'+
    lineChart(d.w, 'робоча вага в кілограмах')+
    '<div class="xrow"><span>рік тому</span><span>сьогодні</span></div>';

  $('[data-chart-volume]').innerHTML =
    '<div class="ct"><span class="h">Обʼєм за тренування, кг</span>'+
    '<span class="now">'+thou(d.v[11])+'</span></div>'+
    barChart(d.v)+
    '<div class="xrow"><span>12 останніх тренувань</span><span>останнє</span></div>';

  $('[data-setlog]').innerHTML = d.log.map(s =>
    '<div class="dategroup"><div class="dh"><span class="d">'+s.d+'</span>'+
    '<span class="vol">'+thou(s.vol)+' кг</span></div>'+
    '<div class="setline">'+s.sets.map(([w,r]) =>

      '<span class="numfield"><label>Повтори</label>'+

dayHost.addEventListener('click', e=>{
  const ed = e.target.closest('[data-edit]');
  if(ed){
    const box = dayHost.querySelector('[data-editor="'+ed.dataset.edit+'"]');
    const open = box.hasAttribute('data-open');
    dayHost.querySelectorAll('.editor').forEach(x => x.removeAttribute('data-open'));
    if(!open) box.setAttribute('data-open','');
    return;
  }

dayHost.addEventListener('input', e=>{
  const inp = e.target.closest('[data-set]'); if(!inp) return;
  const i = +inp.dataset.i, v = parseFloat(inp.value);
  if(!isFinite(v) || v <= 0) return;
  day[i][inp.dataset.set] = v;
  const row = dayHost.querySelector('[data-row="'+i+'"] .mt');
  row.textContent = day[i].sets+' × '+day[i].reps+' · крок '+fmt(day[i].step)+' кг';
});

/* drag to reorder: 1:1 tracking, swap when the pointer crosses a neighbour */
let drag = null;
dayHost.addEventListener('pointerdown', e=>{
  const grip = e.target.closest('[data-grip]'); if(!grip) return;
  const row = grip.closest('.dayex');
  dayHost.querySelectorAll('.editor').forEach(x => x.removeAttribute('data-open'));
  grip.setPointerCapture(e.pointerId);
  drag = {row, grip, startY:e.clientY};
  row.setAttribute('data-drag','');
  row.style.transition = 'none';
});
dayHost.addEventListener('pointermove', e=>{
  if(!drag) return;
  const rows = [...dayHost.querySelectorAll('.dayex')];
  const idx  = rows.indexOf(drag.row);
  const prev = rows[idx-1], next = rows[idx+1];
  const y = e.clientY;
  if(prev && y < prev.getBoundingClientRect().top + prev.offsetHeight/2){
    flip(prev, ()=> dayHost.insertBefore(drag.row, prev));
  } else if(next && y > next.getBoundingClientRect().bottom - next.offsetHeight/2){
    flip(next, ()=> dayHost.insertBefore(drag.row, next.nextSibling));
  }
  drag.row.style.transform = 'translateY('+(y - drag.startY)+'px)';
});
function flip(el, mutate){
  const a = el.getBoundingClientRect().top;
  const before = drag.row.offsetTop;
  mutate();
  drag.startY += drag.row.offsetTop - before;
  const b = el.getBoundingClientRect().top;
  if(reduceMotion()) return;
  el.removeAttribute('data-shift');
  el.style.transition = 'none';
  el.style.transform = 'translateY('+(a-b)+'px)';
  requestAnimationFrame(()=>{
    el.style.transition = '';
    el.setAttribute('data-shift','');
    el.style.transform = '';
  });
}
function endDrag(){
  if(!drag) return;
  const row = drag.row;
  row.removeAttribute('data-drag');
  row.style.transition = 'transform 200ms var(--ease-out)';
  row.style.transform = '';
  const order = [...dayHost.querySelectorAll('.dayex')].map(r => day[+r.dataset.row]);
  drag = null;
  setTimeout(()=>{ day.length = 0; day.push(...order); renderDay(); }, 200);
}
dayHost.addEventListener('pointerup', endDrag);
dayHost.addEventListener('pointercancel', endDrag);

  const name = $('[data-form="name"]').value.trim();
  const err  = $('[data-form-err]');
  if(!name){
    err.textContent = 'Дай програмі назву, інакше ти не відрізниш її від інших у списку.';
    err.setAttribute('data-on','');

/* ---------- one delegated handler ---------- */
root.addEventListener('click', e=>{
  if(e.target.closest('[data-back]')){ back(); return; }

  const chip = e.target.closest('[data-chip]');
  if(chip){ sheetInput.value = chip.textContent; return; }

  const det = e.target.closest('[data-detail]');
  if(det){ state.detail = det.dataset.detail; show('exdetail', true); return; }

  if(e.target.closest('[data-past]')){ show('past', true); return; }

  const tab = e.target.closest('[data-tab]');
  if(tab){ show(TABS.find(x => x.k === tab.dataset.tab).screen); return; }

  const per = e.target.closest('[data-period]');
  if(per){
    $$('[data-period]').forEach(b => b.toggleAttribute('data-on', b === per));
    renderPeriod(per.dataset.period);
    return;
  }

  const go = e.target.closest('[data-go]');
  if(go){ show(go.dataset.go, true); return; }

  const act = e.target.closest('[data-act]');
  if(!act) return;
  switch(act.dataset.act){
    case 'commit':      commit(); break;
    case 'skip':        stopRest(); break;
    case 'swap':        root.setAttribute('data-sheet',''); setTimeout(()=>sheetInput.focus({preventScroll:true}), 340); break;
    case 'close-sheet': root.removeAttribute('data-sheet'); break;
    case 'save-program':saveProgram(); break;
    case 'apply-swap': {
      const v = sheetInput.value.trim();
      if(v){ ex[state.i].sub = v; fillPanel(); }
      root.removeAttribute('data-sheet');
      sheetInput.value = '';
      break;
    }
  }
});

setInterval(()=>{
  state.elapsed++;
  F('elapsed').textContent = clock(state.elapsed);
}, 1000);

restField.textContent = clock(cfg.rest);
F('rest-time').textContent = clock(cfg.rest);
select(0);
updateOffline();
renderSlots();
})();
